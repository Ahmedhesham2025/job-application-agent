discovery:
  # Add company-specific board tokens and explicitly enable them.
  sources:
    - type: greenhouse
      token: replace-with-company-board-token
      enabled: false
    - type: lever
      site: klivvr
      enabled: true
    - type: greenhouse
      token: wppmedia
      enabled: true
    - type: greenhouse
      token: alpaca
      enabled: true
    - type: greenhouse
      token: affirm
      enabled: true
    - type: greenhouse
      token: zyngacareers
      enabled: true
    - type: ashby
      board: adjoe
      enabled: true
    - type: ashby
      board: perk
      enabled: true
    - type: ashby
      board: constructor
      enabled: true
    - type: ashby
      board: gismart
      enabled: true
    - type: ashby
      board: satispay
      enabled: true
    - type: ashby
      board: subsets
      enabled: true
    - type: ashby
      board: openai
      enabled: true
    - type: ashby
      board: confido
      enabled: true
    - type: ashby
      board: voodoo
      enabled: true

submission:
  enabled: true
  # assist = the agent fills the form in Chrome; you solve the CAPTCHA and press Submit.
  mode: assist
  live_submission_enabled: false
  maximum_per_day: 5
  daily_limit_timezone: Africa/Cairo
  allowed_domains:
    - jobs.lever.co
    - job-boards.greenhouse.io
    - boards.greenhouse.io
    - jobs.ashbyhq.com
  approved_resume_sha256:
    - replace-with-sha256-of-your-cv   # python -c "import hashlib;print(hashlib.sha256(open(\'config/resume/cv.pdf\',\'rb\').read()).hexdigest())"
  allowed_answer_categories:
    - identity
    - contact
    - experience
    - education
    - skills
    - availability
    - relocation
    - sponsorship
    - salary
    - work_authorization
    - preference
    - consent
    - open_answer
    # Only ever answered with "Prefer not to say" (enforced in code).
    - demographic
    - disability
    - veteran_status
  blocked_answer_categories:
    - criminal_history
    - legal_attestation
    - security_clearance
    - assessment
    - recorded_interview
    - unknown
  review_triggers:
    - captcha_present
    - unknown_question
    - external_redirect
    - assessment_required
    - recorded_interview_required
    - login_challenge
    - selector_changed
